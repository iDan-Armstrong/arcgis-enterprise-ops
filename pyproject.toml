[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "egisops"
version = "0.5.0"
description = "Operations checks for ArcGIS Enterprise on the ArcGIS REST Administrator API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daniel Armstrong" }]
requires-python = ">=3.11"
dependencies = []  # standard library only, on purpose (ADR 0002)

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# stack-compat's database side uses rdsops and its Esri support matrix (ADR 0007).
stack = ["rdsops @ git+https://github.com/iDan-Armstrong/rds-geodatabase-ops@v0.4.0"]

[project.scripts]
egisops = "egisops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
